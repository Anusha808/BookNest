<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | BookNest</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>

<body>

<div class="reset-page">

    <div class="reset-box">

        <!-- LOGO -->
        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            <span>Book<span>Nest</span></span>
        </div>

        <!-- ICON -->
        <div class="reset-icon">
            <i class="fa-solid fa-key"></i>
        </div>

        <!-- HEADING -->
        <div class="heading">

            <h1>Reset Password</h1>

            <p>
                Create a new password for your BookNest account.
            </p>

        </div>

        <!-- ERROR MESSAGE -->
        <div class="message error-message"
             th:if="${error}"
             th:text="${error}">
        </div>

        <!-- FORM -->
        <form th:if="${validToken}"
              th:action="@{/reset-password}"
              method="post">

            <!-- TOKEN -->
            <input type="hidden"
                   name="token"
                   th:value="${token}">

            <!-- NEW PASSWORD -->
            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

            <button type="submit"
                    class="reset-btn">

                Reset Password

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>

        <!-- BACK TO LOGIN -->
        <a href="/login" class="back-login">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>

        <!-- HOME -->
        <a href="/" class="home-link">
            Back to Home
        </a>

    </div>

</div>

<script>

function togglePassword(fieldId, button) {

    const field = document.getElementById(fieldId);
    const icon = button.querySelector("i");

    if (field.type === "password") {

        field.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        field.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

</script>

</body>

</html>
