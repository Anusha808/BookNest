<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | BookNest</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>

<body>

<div class="forgot-page">

    <div class="forgot-box">

        <!-- LOGO -->
        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            <span>Book<span>Nest</span></span>
        </div>

        <!-- ICON -->
        <div class="forgot-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <!-- HEADING -->
        <div class="heading">

            <h1>Forgot Password?</h1>

            <p>
                No worries! Enter your email address and we'll
                help you reset your password.
            </p>

        </div>

        <!-- SUCCESS / INFO MESSAGE -->
        <div class="message"
             th:if="${message}"
             th:text="${message}">
        </div>

        <!-- FORM -->
        <form id="forgotForm"
              th:action="@{/forgot-password}"
              method="post">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required>

                </div>

            </div>

            <button type="submit" class="reset-btn">

                Send Reset Link

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>

        <!-- LOGIN -->
        <a href="/login" class="back-login">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>

        <!-- HOME -->
        <a href="/" class="home-link">
            Back to Home
        </a>

    </div>

</div>

</body>

</html>
