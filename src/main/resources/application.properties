# ==========================================================
# BOOKNEST - APPLICATION CONFIGURATION
# ==========================================================

spring.application.name=online-bookstore


# ==========================================================
# MYSQL DATABASE CONFIGURATION
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/online_bookstore

spring.datasource.username=root

spring.datasource.password=xxxxxxxx


# ==========================================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ==========================================================
# GMAIL SMTP CONFIGURATION
# ==========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${BOOKNEST_MAIL_USERNAME}

spring.mail.password=${BOOKNEST_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true


# ==========================================================
# RAZORPAY TEST MODE CONFIGURATION
# ==========================================================

razorpay.key.id=rzp_test_xxxxxxxxxxxxxx

razorpay.key.secret=xxxxxxxxxxxxxxx